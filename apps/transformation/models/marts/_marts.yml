version: 2

models:
  - name: mart_country_indicators
    columns:
      - name: country_code
        tests: [not_null]
      - name: indicator_code
        tests: [not_null]
      - name: year
        tests: [not_null]
      - name: value
        tests: [not_null]

  - name: mart_country_refugee_stats
    columns:
      - name: country_iso3
        tests: [not_null]
      - name: year
        tests: [not_null]
      - name: total_displaced_hosted
        tests: [not_null]

  - name: mart_indicator_yoy_growth
    columns:
      - name: country_code
        tests: [not_null]
      - name: year
        tests: [not_null]

  - name: mart_client_portfolio
    columns:
      - name: country_iso3
        tests: [not_null, unique]
      - name: clients_total
        tests: [not_null]
      - name: businesses_total
        tests: [not_null]

  - name: mart_loan_performance
    columns:
      - name: country_iso3
        tests: [not_null]
      - name: disbursement_month
        tests: [not_null]
      - name: loans_disbursed
        tests: [not_null]
      - name: par30_pct
        tests: [not_null]

  - name: mart_repayment_performance
    columns:
      - name: country_iso3
        tests: [not_null]
      - name: paid_period
        tests: [not_null]
      - name: on_time_rate_pct
        tests: [not_null]

  - name: mart_business_growth
    columns:
      - name: country_iso3
        tests: [not_null]
      - name: period
        tests: [not_null]
      - name: businesses_reporting
        tests: [not_null]

  - name: mart_country_program_context
    columns:
      - name: country_iso3
        tests: [not_null, unique]
      - name: clients_total
        tests: [not_null]
