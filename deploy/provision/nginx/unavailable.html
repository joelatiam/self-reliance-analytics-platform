<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application unavailable</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c1f23; --muted: #5c636b;
    --line: #e3e6ea; --accent: #b4451f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1c1f24; --ink: #e8eaed; --muted: #9aa2ac;
      --line: #2b2f36; --accent: #e0794c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink); padding: 24px;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 40px; max-width: 30rem; width: 100%;
  }
  h1 { margin: 0 0 12px; font-size: 1.4rem; letter-spacing: -0.01em; }
  p { margin: 0 0 14px; color: var(--muted); }
  .host {
    display: inline-block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.9rem; color: var(--accent); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px;
    word-break: break-all;
  }
  .foot { margin: 22px 0 0; padding-top: 16px; border-top: 1px solid var(--line);
          font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <h1>This application isn't available</h1>
    <p><span class="host" id="host">this address</span> isn't serving anything right now.</p>
    <p>Either the service behind it is stopped or restarting, or no application
       has been deployed to this address yet.</p>
    <p class="foot">If it was working a moment ago, it is probably mid-restart —
       try again shortly.</p>
  </main>
  <script>
    try { document.getElementById('host').textContent = location.hostname; } catch (e) {}
  </script>
</body>
</html>
