<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>joelatiam.com</title>
<meta name="description" content="Get in touch — email, phone or WhatsApp.">
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #16181c; --muted: #5a626b;
    --line: #e2e5ea; --accent: #1f5f8b; --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216; --card: #191c21; --ink: #e9ebee; --muted: #98a0aa;
      --line: #282c33; --accent: #6aa8d8; --accent-ink: #101216;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink); padding: 24px;
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 44px 40px; max-width: 30rem; width: 100%;
  }
  h1 { margin: 0 0 6px; font-size: 1.55rem; letter-spacing: -0.02em; }
  .sub { margin: 0 0 30px; color: var(--muted); font-size: 0.98rem; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  a.row {
    display: flex; align-items: center; gap: 14px; text-decoration: none;
    color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; transition: border-color .15s ease, transform .15s ease;
  }
  a.row:hover { border-color: var(--accent); transform: translateY(-1px); }
  a.row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ico {
    flex: 0 0 34px; height: 34px; display: grid; place-items: center;
    border-radius: 8px; background: var(--accent); color: var(--accent-ink);
    font-size: 0.95rem;
  }
  .label { display: block; font-size: 0.76rem; text-transform: uppercase;
           letter-spacing: 0.07em; color: var(--muted); }
  .value { display: block; font-size: 0.97rem; word-break: break-all; }
  .foot { margin: 28px 0 0; padding-top: 18px; border-top: 1px solid var(--line);
          font-size: 0.84rem; color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <h1>Get in touch</h1>
    <p class="sub">The quickest ways to reach me.</p>
    <ul>
      <li>
        <a class="row" href="mailto:joelatiam@googlemail.com">
          <span class="ico" aria-hidden="true">&#9993;</span>
          <span><span class="label">Email</span>
                <span class="value">joelatiam@googlemail.com</span></span>
        </a>
      </li>
      <li>
        <a class="row" href="tel:+250783780758">
          <span class="ico" aria-hidden="true">&#9742;</span>
          <span><span class="label">Phone</span>
                <span class="value">+250 783 780 758</span></span>
        </a>
      </li>
      <li>
        <a class="row" href="https://wa.me/250783780758" rel="noopener">
          <span class="ico" aria-hidden="true">&#128172;</span>
          <span><span class="label">WhatsApp</span>
                <span class="value">+250 783 780 758</span></span>
        </a>
      </li>
    </ul>
    <p class="foot">joelatiam.com</p>
  </main>
</body>
</html>
