# Metabase for bi.joelatiam.com. Kept in a separate file, not merged into the
# production override, because it is optional and memory-hungry:
#
#   docker compose -f docker-compose.yml -f deploy/compose.prod.yml \
#                  -f deploy/compose.bi.yml up -d metabase
#
# REQUIRES 8 GB or larger. On the 4 GB droplet the rest of the stack already sat
# at ~2.7 GB with swap in use, and Metabase needs a couple of gigabytes to itself
# — it would not start in what was left.
#
# Uses the bundled H2 application database rather than its own Postgres. That is
# the wrong choice for real production — H2 is a single file with no concurrent
# access story — but right for a demo: one fewer container, one fewer password,
# and nothing here is the system of record.

services:
  metabase:
    image: metabase/metabase:v0.50.21
    container_name: sr-metabase
    restart: unless-stopped
    mem_limit: 3g
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_JETTY_HOST: 0.0.0.0
      MB_JETTY_PORT: "3001"
      # Metabase is Clojure, and Clojure is hungry for metaspace specifically.
      # A first attempt at -Xmx900m -XX:MaxMetaspaceSize=200m died on startup
      # with a JVM OutOfMemoryError (not a cgroup kill), so metaspace is left
      # unbounded and the heap given room.
      JAVA_OPTS: "-Xmx2g"
      MB_SITE_URL: "https://bi.${APP_DOMAIN:-joelatiam.com}"
      # Metabase seeds an "Examples" collection and a Sample Database on first
      # boot. Off here: this instance has one purpose, and demo content next to
      # the real marts makes the collection tree harder to read, not easier.
      # Only affects a fresh application database — an instance that already
      # created them needs them removed once (see apps/bi/README.md).
      MB_LOAD_SAMPLE_CONTENT: "false"
    volumes:
      - metabase-data:/metabase-data
      # Metabase ships no ClickHouse driver; the jar is fetched into this
      # directory by deploy/provision/86-metabase-driver.sh and loaded at boot.
      - /var/www/production/metabase-plugins:/plugins:ro
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3001/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s

volumes:
  metabase-data:
