name: Deploy

# Deploys only after CI is green on `production`, so a merge that breaks the
# build never reaches the droplet. `main` is the integration branch; promoting
# to `production` is the deliberate act that ships. `workflow_dispatch` is there
# for manual redeploys (e.g. after changing .env on the server).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires on failure too; only act on success.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deploy on droplet
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$USER@$HOST" \
            '/var/www/production/self-reliance-analytics-platform/deploy/deploy.sh'

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
