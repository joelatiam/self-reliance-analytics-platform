name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ingestion-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r apps/ingestion/requirements.txt pytest ruff
      - run: ruff check apps/ingestion/src apps/orchestration/dags
      - run: pytest apps/ingestion/tests -v

  dbt-build:
    runs-on: ubuntu-latest
    needs: ingestion-tests
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_DB: worldbank
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ClickHouse client
        run: curl https://clickhouse.com/ | sh

      - name: Seed warehouse schema for CI
        run: |
          ./clickhouse client --host 127.0.0.1 --multiquery < apps/warehouse/init/02_raw_tables.sql
          ./clickhouse client --host 127.0.0.1 --multiquery < apps/warehouse/init/ci_seed_data.sql

      - name: Install dbt
        run: pip install -r apps/transformation/requirements.txt

      - name: dbt build
        working-directory: apps/transformation
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_HTTP_PORT: "8123"
          CLICKHOUSE_DB: worldbank
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          DBT_PROFILES_DIR: .
        run: dbt build
