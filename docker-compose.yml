name: worldbank-indicators-pipeline

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: apps/orchestration/Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW_UID: "${AIRFLOW_UID:-50000}"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-worldbank}
    POSTGRES_USER: ${POSTGRES_USER:-wb_app}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wb_app_pw}
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_HTTP_PORT: "8123"
    CLICKHOUSE_DB: ${CLICKHOUSE_DB:-worldbank}
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_pw}
    WORLD_BANK_BASE_URL: ${WORLD_BANK_BASE_URL:-https://api.worldbank.org/v2}
    WORLD_BANK_COUNTRIES: ${WORLD_BANK_COUNTRIES:-RW,KE,ET,SS,TD}
    WORLD_BANK_INDICATORS: ${WORLD_BANK_INDICATORS:-NY.GDP.MKTP.KD.ZG,SL.UEM.TOTL.ZS,SI.POV.NAHC,FX.OWN.TOTL.ZS}
    CLIENTS_API_BASE_URL: ${CLIENTS_API_BASE_URL:-http://clients-api:4000/api/v1}
    CLIENTS_API_KEY: ${CLIENTS_API_KEY:-}
    CLIENTS_API_PAGE_SIZE: ${CLIENTS_API_PAGE_SIZE:-500}
  volumes:
    - ./apps/orchestration/dags:/opt/airflow/dags
    - ./apps/ingestion:/opt/airflow/ingestion
    - ./apps/transformation:/opt/airflow/dbt
    - airflow-state:/opt/airflow
  depends_on:
    postgres:
      condition: service_healthy
    clickhouse:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: wb-postgres
    command: >
      -c wal_level=logical
      -c max_replication_slots=4
      -c max_wal_senders=4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-worldbank}
      POSTGRES_USER: ${POSTGRES_USER:-wb_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wb_app_pw}
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./apps/ingestion/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wb_app} -d ${POSTGRES_DB:-worldbank}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.7.0
    container_name: wb-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "wbpipeline-kraft-cluster-1"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-connect:
    image: debezium/connect:2.6
    container_name: wb-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: wb-connect-cluster
      CONFIG_STORAGE_TOPIC: wb_connect_configs
      OFFSET_STORAGE_TOPIC: wb_connect_offsets
      STATUS_STORAGE_TOPIC: wb_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 15

  connector-init:
    build:
      context: ./apps/cdc
    container_name: wb-connector-init
    depends_on:
      kafka-connect:
        condition: service_healthy
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: wb-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-worldbank}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_pw}
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9363:9363"
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./apps/warehouse/init:/docker-entrypoint-initdb.d
      - ./apps/warehouse/config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    container_name: wb-airflow-init
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: wb-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 15

  airflow-scheduler:
    <<: *airflow-common
    container_name: wb-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Simulated program source system: generates client, business and loan
  # activity on the 5th, 15th, 25th, ... minute. The pipeline pulls it on the
  # ten-minute boundary, so every fetch reads data that settled five minutes ago.
  clients-api-db:
    image: postgres:16
    container_name: sr-clients-api-db
    environment:
      POSTGRES_DB: ${CLIENTS_API_DB_NAME:-self_reliance_ops}
      POSTGRES_USER: ${CLIENTS_API_DB_USER:-sr_app}
      POSTGRES_PASSWORD: ${CLIENTS_API_DB_PASSWORD:-sr_app_pw}
    ports:
      - "5434:5432"
    volumes:
      - clients-api-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLIENTS_API_DB_USER:-sr_app} -d ${CLIENTS_API_DB_NAME:-self_reliance_ops}"]
      interval: 5s
      timeout: 5s
      retries: 20

  clients-api:
    build:
      context: ./apps/clients-api
    container_name: sr-clients-api
    environment:
      NODE_ENV: production
      APP_PORT: "4000"
      API_PREFIX: api
      API_KEY: ${CLIENTS_API_KEY:-}
      DATABASE_HOST: clients-api-db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${CLIENTS_API_DB_NAME:-self_reliance_ops}
      DATABASE_USERNAME: ${CLIENTS_API_DB_USER:-sr_app}
      DATABASE_PASSWORD: ${CLIENTS_API_DB_PASSWORD:-sr_app_pw}
      SIMULATION_MODE: ${SIMULATION_MODE:-live}
      SIMULATION_COUNTRIES: ${SIMULATION_COUNTRIES:-RWA,KEN,ETH,SSD,TCD}
      SIMULATION_SEED_ON_BOOT: ${SIMULATION_SEED_ON_BOOT:-true}
      SIMULATION_SEED_CLIENTS: ${SIMULATION_SEED_CLIENTS:-250}
      SIMULATION_CRON_ENABLED: ${SIMULATION_CRON_ENABLED:-true}
    ports:
      - "4000:4000"
    depends_on:
      clients-api-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  metrics-exporter:
    build:
      context: ./apps/observability/metrics_exporter
    container_name: wb-metrics-exporter
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-worldbank}
      POSTGRES_USER: ${POSTGRES_USER:-wb_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wb_app_pw}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_pw}
    ports:
      - "9105:9105"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: wb-prometheus
    volumes:
      - ./apps/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prom-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: wb-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./apps/observability/grafana/provisioning:/etc/grafana/provisioning
      - ./apps/observability/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pg-data:
  clients-api-db-data:
  ch-data:
  prom-data:
  grafana-data:
  airflow-state:
